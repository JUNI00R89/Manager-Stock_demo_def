[pytest]
testpaths = backend/tests
# Los test_*.py del backend son scripts: los recoge backend/tests/conftest.py
# y los ejecuta cada uno en su propio proceso. Este patrón evita que pytest
# además los importe como módulos (cada uno cambia la base de datos al importarse).
python_files = *_pytest_module.py
addopts = -p no:cacheprovider
